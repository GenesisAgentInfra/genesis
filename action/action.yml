name: Genesis Code Intelligence
description: Analyze frozen Python changes and deliver a five-section report without executing customer code.
inputs:
  repo:
    description: Checked-out customer repository path
    default: .
  base:
    description: Base revision; PR base SHA or local default branch merge-base when omitted
    default: ''
  task:
    description: Optional repository-relative task file
    default: ''
  service-url:
    description: Explicit trusted Genesis service origin (HTTPS outside loopback)
    default: ''
  api-key:
    description: Genesis pilot key; omitted keys and fork PRs run offline
    default: ''
  github-token:
    description: Repository-scoped read token for PR closing-issue metadata; never used on fork PRs
    default: ${{ github.token }}
  artifact-name:
    description: Report artifact name; choose distinct names for multiple invocations in one workflow
    default: genesis-code-intelligence-report
outputs:
  analysis-status:
    description: complete, partial, or failed; not a business acceptance verdict
    value: ${{ steps.analysis.outputs.analysis-status }}
  report-directory:
    description: Private local runner output directory
    value: ${{ steps.analysis.outputs.report-directory }}
  summary-sha256:
    description: SHA-256 of report bytes read back after appending the Job Summary
    value: ${{ steps.analysis.outputs.summary-sha256 }}
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - name: Install isolated pinned CLI
      shell: bash
      env:
        GENESIS_ACTION_PATH: ${{ github.action_path }}
        UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/genesis-cli-runtime
      run: |
        cd "$RUNNER_TEMP"
        python -I -m pip install uv==0.13.7
        python -I -m uv sync --project "$GENESIS_ACTION_PATH/.." --package genesis-ci --no-dev --frozen
    - name: Analyze frozen source
      id: analysis
      shell: bash
      env:
        GENESIS_ACTION_PATH: ${{ github.action_path }}
        GENESIS_ACTION_REPO: ${{ inputs.repo }}
        GENESIS_ACTION_BASE: ${{ inputs.base }}
        GENESIS_ACTION_TASK: ${{ inputs.task }}
        GENESIS_SERVICE_URL: ${{ inputs.service-url }}
        GENESIS_API_KEY: ${{ inputs.api-key }}
        GENESIS_GITHUB_TOKEN: ${{ inputs.github-token }}
      run: '"$RUNNER_TEMP/genesis-cli-runtime/bin/python" -I "$GENESIS_ACTION_PATH/run.py"'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      if: ${{ steps.analysis.outputs.report-directory != '' }}
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.analysis.outputs.report-directory }}/summary.md
          ${{ steps.analysis.outputs.report-directory }}/report.md
          ${{ steps.analysis.outputs.report-directory }}/report.json
        retention-days: 7
