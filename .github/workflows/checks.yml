name: Public client
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -I -m pip install uv==0.13.7
      - name: Install and test without a private service
        run: |
          uv sync --all-packages --group dev --frozen
          uv run --all-packages --frozen ruff check packages scripts tests
          uv run --all-packages --frozen ruff format --check packages scripts tests
          uv run --all-packages --frozen pytest -q
          uv run --all-packages --frozen python scripts/check_public_boundary.py
          uv run --all-packages --frozen python scripts/build_map_fixtures.py
          git diff --exit-code
      - name: Build isolated client wheels
        run: |
          uv build --package genesis-ci --wheel
          uv build --package genesis-contracts --wheel
          uv run --all-packages --frozen python scripts/check_packages.py
      - name: Install the way docs/install.md says, without the lockfile
        run: |
          uv tool install --python 3.12 ./packages/genesis_ci
          "$(uv tool dir --bin)/genesis" agent install --agent claude
          "$(uv tool dir --bin)/genesis" agent status --agent claude
          python3 -I ~/.claude/skills/genesis/scripts/run_genesis.py version
  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      # The paid Graphical editor is an optional dependency that is not in the
      # repository; npm skips it, and the page builds without it.
      - name: Install without the paid editor package
        run: npm ci --no-audit --no-fund
      - name: Test, lint and type-check
        run: |
          npm test
          npm run lint
          npm run typecheck
      - name: Build, and check the committed page is the one the source produces
        run: |
          npm run build
          git diff --exit-code -- ../packages/genesis_ci/src/genesis_ci/assets/viewer/index.html
      - name: Check readability of the built standalone viewer in Chromium
        run: |
          npx --no-install playwright install --with-deps --only-shell chromium
          npm run test:browser
