[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "genesis-ci"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12"
dependencies = [
    "genesis-contracts==0.1.0",
    "genesis-tokenizer==0.1.0",
    "httpx>=0.28,<1",
    "typer>=0.15,<1",
    "PyYAML>=6,<7",
    "libcst==1.9.0",
]

[project.scripts]
genesis = "genesis_ci.cli:app"

[tool.uv.sources]
genesis-contracts = { workspace = true }
genesis-tokenizer = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/genesis_ci"]
